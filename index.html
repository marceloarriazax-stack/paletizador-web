<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Pallet</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
    }
    label { display: block; margin-top: 5px; }
    #result { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="controls">
    <!-- Inputs para las cajas -->
<label>Dimensiones caja (Largo, Ancho, Alto):
  <input type="text" id="boxDimensions" placeholder="Ej: 82.00 26.00 36.00">
</label>

<label>Peso por caja (kg):
  <input type="number" id="boxWeight" placeholder="Ej: 12.5" step="0.01" min="0">
</label>

<button id="addBoxes">Agregar cajas</button>
    <!-- Inputs para el pallet -->
    <hr>
    <label>Ancho pallet (m): <input type="number" id="palletWidthInput" value="1.1" step="0.05" min="0.05"></label>
    <label>Largo pallet (m): <input type="number" id="palletDepthInput" value="1.2" step="0.05" min="0.05"></label>
    <label>Altura pallet (m): <input type="number" id="palletHeightInput" value="0.15" step="0.05" min="0.05"></label>
<label>Peso por caja (kg):
  <input type="number" id="boxWeight" placeholder="Ej: 12.5" step="0.01" min="0">
</label>
    <button id="updatePallet">Actualizar pallet</button>

    <div id="result">Cajas en pallet: 0</div>
  </div>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
<script>
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  var palletWidth = 1.1;
  var palletDepth = 1.2;
  var palletHeight = 0.15;

  var palletMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
  var palletGeometry = new THREE.BoxGeometry(palletWidth, palletHeight, palletDepth);
  var pallet = new THREE.Mesh(palletGeometry, palletMaterial);
  pallet.position.y = -palletHeight / 2;
  scene.add(pallet);

  var grid = new THREE.GridHelper(5, 10);
  scene.add(grid);

  var radius = 3;
  var angle = 0;
  var pitch = 0.3;
  var pitchMin = -1;
  var pitchMax = 1;
  camera.position.set(radius * Math.cos(angle), 1.5, radius * Math.sin(angle));
  camera.lookAt(new THREE.Vector3(0, 0, 0));

  var isDragging = false;
  var previousMouseX = 0;
  var previousMouseY = 0;

  document.addEventListener('mousedown', function(event) {
    if (event.button === 0) {
      isDragging = true;
      previousMouseX = event.clientX;
      previousMouseY = event.clientY;
    }
  });
  document.addEventListener('mouseup', function(event) {
    if (event.button === 0) isDragging = false;
  });
  document.addEventListener('mousemove', function(event) {
    if (!isDragging) return;
    var deltaX = event.clientX - previousMouseX;
    var deltaY = event.clientY - previousMouseY;
    previousMouseX = event.clientX;
    previousMouseY = event.clientY;
    angle += deltaX * 0.005;
    pitch -= deltaY * 0.003;
    pitch = Math.max(pitchMin, Math.min(pitchMax, pitch));
    var x = radius * Math.cos(pitch) * Math.cos(angle);
    var y = radius * Math.sin(pitch);
    var z = radius * Math.cos(pitch) * Math.sin(angle);
    camera.position.set(x, y, z);
    camera.lookAt(new THREE.Vector3(0, 0, 0));
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

 function addBoxes() {

  var input = document.getElementById("boxDimensions").value.trim();

  // Separar por tab, espacio o coma
  var parts = input.split(/[\s,]+/);

  if (parts.length < 3) {
    alert("Por favor ingresa 3 valores: Largo, Ancho y Alto");
    return;
  }

  // Orden: Largo, Ancho, Alto
  var boxD = parseFloat(parts[0]) / 100; // Largo
  var boxW = parseFloat(parts[1]) / 100; // Ancho
  var boxH = parseFloat(parts[2]) / 100; // Alto

  // Peso unitario
  var boxWeight = parseFloat(document.getElementById("boxWeight").value);

  if (
    isNaN(boxW) ||
    isNaN(boxD) ||
    isNaN(boxH) ||
    boxW <= 0 ||
    boxD <= 0 ||
    boxH <= 0
  ) {
    alert("Dimensiones inválidas");
    return;
  }

  if (isNaN(boxWeight) || boxWeight <= 0) {
    alert("Ingresa un peso válido para la caja");
    return;
  }

  // Eliminar cajas anteriores
  for (var i = scene.children.length - 1; i >= 0; i--) {
    if (
      scene.children[i].userData &&
      (scene.children[i].userData.type === "box" ||
       scene.children[i].userData.type === "edge")
    ) {
      scene.remove(scene.children[i]);
    }
  }

  var maxStackHeight = 1.50;
  var maxLayers = Math.floor(maxStackHeight / boxH);
  let totalBoxes = 0;

  // -------------------------
  // Bin packing corregido
  // -------------------------
  function generateLayer(yOffset, rotateLayer) {

    let occupied = [];

    function fits(x, z, w, d) {
      // Validar que la caja no exceda los límites del pallet
      if (x + w > palletWidth || z + d > palletDepth) {
        return false;
      }

      // Validar que no se superponga con cajas existentes
      for (let r of occupied) {
        if (
          !(x + w <= r.x ||
            x >= r.x + r.w ||
            z + d <= r.z ||
            z >= r.z + r.d)
        ) {
          return false;
        }
      }

      return true;
    }

    let orientations = [
      { w: boxW, d: boxD },
      { w: boxD, d: boxW }
    ];

    // Usar paso discreto basado en dimensiones reales de la caja
    let step = Math.min(boxW, boxD) / 2;
    if (step < 0.001) step = 0.001; // Mínimo para evitar infinitos

    for (let z = 0; z <= palletDepth - Math.min(boxD, boxW); z += step) {
      for (let x = 0; x <= palletWidth - Math.min(boxW, boxD); x += step) {
        for (let o of orientations) {
          if (fits(x, z, o.w, o.d)) {
            let geometry = new THREE.BoxGeometry(
              o.w,
              boxH,
              o.d
            );

            let solidMaterial =
              new THREE.MeshLambertMaterial({
                color: rotateLayer
                  ? 0xffa07a
                  : 0x87CEEB
              });

            let box =
              new THREE.Mesh(
                geometry,
                solidMaterial
              );

            box.position.set(
              -palletWidth / 2 + x + o.w / 2,
              boxH / 2 + yOffset,
              -palletDepth / 2 + z + o.d / 2
            );

            box.userData = {
              type: "box"
            };

            scene.add(box);

            let wireMaterial =
              new THREE.MeshBasicMaterial({
                color: 0x000000,
                wireframe: true
              });

            let wireBox =
              new THREE.Mesh(
                geometry,
                wireMaterial
              );

            wireBox.position.copy(
              box.position
            );

            wireBox.userData = {
              type: "edge"
            };

            scene.add(wireBox);

            occupied.push({
              x: x,
              z: z,
              w: o.w,
              d: o.d
            });

            totalBoxes++;

            // Parar si ya alcanzamos el límite físico
            if (totalBoxes >= Math.floor((palletWidth * palletDepth * maxStackHeight) / (boxW * boxD * boxH))) {
              return;
            }

            // Saltar a la siguiente posición válida
            x += o.w - step;
          }
        }
      }
    }
  }

  for (let h = 0; h < maxLayers; h++) {
    generateLayer(
      h * boxH,
      h % 2 === 1
    );
  }

  // -------------------------
  // Estadísticas corregidas
  // -------------------------

  let palletVolume =
    palletWidth *
    palletDepth *
    maxStackHeight;

  let boxVolume =
    boxW *
    boxD *
    boxH *
    totalBoxes;

  let occupancy =
    (
      boxVolume /
      palletVolume *
      100
    ).toFixed(1);

  let totalWeight =
    (
      totalBoxes *
      boxWeight
    ).toFixed(2);

  document.getElementById(
    "result"
  ).textContent =
    "Cajas en pallet: " +
    totalBoxes +
    " | Capas: " +
    maxLayers +
    " | Ocupación: " +
    occupancy +
    "%" +
    " | Peso total: " +
    totalWeight +
    " kg";
}
  document.getElementById("addBoxes").addEventListener("click", addBoxes);

  document.getElementById("updatePallet").addEventListener("click", function () {
    palletWidth = parseFloat(document.getElementById("palletWidthInput").value);
    palletDepth = parseFloat(document.getElementById("palletDepthInput").value);
    palletHeight = parseFloat(document.getElementById("palletHeightInput").value);
    scene.remove(pallet);
    palletGeometry = new THREE.BoxGeometry(palletWidth, palletHeight, palletDepth);
    pallet = new THREE.Mesh(palletGeometry, palletMaterial);
    pallet.position.y = -palletHeight / 2;
    scene.add(pallet);
    addBoxes();
  });
</script>
</body>
</html>
