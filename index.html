<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletizador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Calculadora</p>
          <h1>Paletizador de cajas</h1>
        </div>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Datos de la caja</h2>

          <form id="calculator-form">
            <div class="grid-inputs">
              <label>
                <span>Largo (m)</span>
                <input id="box-length" type="number" min="0.01" step="0.01" value="0.4" required />
              </label>
              <label>
                <span>Ancho (m)</span>
                <input id="box-width" type="number" min="0.01" step="0.01" value="0.3" required />
              </label>
              <label>
                <span>Alto (m)</span>
                <input id="box-height" type="number" min="0.01" step="0.01" value="0.2" required />
              </label>
            </div>

            <div class="grid-inputs pallet-grid">
              <label>
                <span>Pallet largo (m)</span>
                <input id="pallet-length" type="number" min="0.01" step="0.01" value="1.2" />
              </label>
              <label>
                <span>Pallet ancho (m)</span>
                <input id="pallet-width" type="number" min="0.01" step="0.01" value="1.0" />
              </label>
              <label>
                <span>Espesor pallet (m)</span>
                <input id="pallet-thickness" type="number" min="0.01" step="0.01" value="0.13" />
              </label>
              <label>
                <span>Altura máxima (m)</span>
                <input id="max-height" type="number" min="0.01" step="0.01" value="1.6" />
              </label>
            </div>

            <div class="actions">
              <button type="submit">Calcular</button>
              <button type="button" class="secondary" id="load-example">Ejemplo</button>
            </div>
          </form>
        </section>

        <section class="panel result-panel">
          <h2>Resultado</h2>
          <div id="result" class="result-box">
            <p class="muted">Completa los datos y calcula la mejor disposición.</p>
          </div>
        </section>
      </main>

      <section class="panel viz-panel">
        <h2>Visualización 3D</h2>
        <div id="canvas-container"></div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
