<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Pallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050d14; --panel:rgba(9,20,30,.84); --panel-2:rgba(255,255,255,.035);
  --line:rgba(110,200,235,.16); --line-strong:rgba(110,200,235,.38);
  --cyan:#3fd0ff; --green:#2de2b5; --violet:#4f6bff;
  --text:#e6f1f7; --muted:#7f9aaa;
  --display:"Chakra Petch","Segoe UI",Arial,sans-serif;
  --body:"Inter","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--body);color:var(--text);background-color:var(--bg);
  background-image:
    radial-gradient(circle at 84% 18%,rgba(45,226,181,.10),transparent 40%),
    radial-gradient(circle at 16% 84%,rgba(79,107,255,.18),transparent 42%),
    radial-gradient(circle at 55% 48%,rgba(30,110,150,.16),transparent 50%),
    linear-gradient(90deg,rgba(90,170,200,.05) 1px,transparent 1px),
    linear-gradient(0deg,rgba(90,170,200,.05) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,56px 56px,56px 56px;
}
/* viñeta para dar profundidad */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(2,6,10,.65) 100%)}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;cursor:grab}
canvas:active{cursor:grabbing}

/* ---------- Barra superior ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:11;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px 0 358px;
  background:linear-gradient(180deg,rgba(5,13,20,.85),rgba(5,13,20,0));pointer-events:none}
#topbar .crumb{font-size:12px;color:var(--muted);letter-spacing:.2px}
#topbar .crumb b{color:var(--text);font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(9,20,30,.6)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Panel ---------- */
#controls{
  position:absolute;top:18px;left:18px;bottom:18px;width:324px;padding:20px 18px 18px;z-index:10;
  display:flex;flex-direction:column;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
}
/* esquinas tipo HUD */
#controls::before,#controls::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--cyan);pointer-events:none}
#controls::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:6px}
#controls::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:6px}

.brand{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand svg{flex:none;filter:drop-shadow(0 0 8px rgba(63,208,255,.55))}
.brand h1{margin:0;font:700 19px/1.1 var(--display);letter-spacing:.4px}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}

.sec{margin-top:18px}
.sec-title{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:600 13px var(--display);letter-spacing:.3px;color:var(--text)}
.sec-title::before{content:"";width:8px;height:8px;background:var(--cyan);transform:rotate(45deg);box-shadow:0 0 8px var(--cyan)}
.sec-title.alt::before{background:var(--violet);box-shadow:0 0 8px var(--violet)}

label{display:block;margin:12px 0 6px;font-size:11.5px;font-weight:500;color:var(--muted)}
.field{position:relative}
.field .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 11px var(--mono);color:var(--muted);pointer-events:none}
input{
  width:100%;height:40px;padding:0 40px 0 12px;
  border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.28);
  color:var(--text);font:500 13.5px var(--mono);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
}
input:hover{border-color:var(--line-strong)}
input:focus{border-color:var(--cyan);background:rgba(63,208,255,.05);box-shadow:0 0 0 3px rgba(63,208,255,.14)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

button{
  width:100%;height:42px;margin-top:14px;border-radius:4px;cursor:pointer;
  font:600 13px var(--display);letter-spacing:.4px;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;
}
#addBoxes{border:1px solid var(--cyan);color:#021018;background:linear-gradient(180deg,#5adaff,#2bb6e6);box-shadow:0 0 18px rgba(63,208,255,.3)}
#addBoxes:hover{box-shadow:0 0 26px rgba(63,208,255,.5);transform:translateY(-1px)}
#updatePallet{border:1px solid var(--line-strong);color:var(--text);background:var(--panel-2)}
#updatePallet:hover{border-color:var(--cyan);background:rgba(63,208,255,.08);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

hr{border:none;border-top:1px solid var(--line);margin:20px 0 0}

/* ---------- Resultados ---------- */
.res-head{margin-top:auto;padding-top:20px}
#result{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi strong{display:block;margin-top:4px;font:600 20px/1.1 var(--mono);color:var(--text)}
.kpi strong small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.wide{grid-column:1/-1}
.bar{height:5px;margin-top:9px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--green));transition:width .5s ease}

/* ---------- Leyenda y ayuda ---------- */
#hud{position:fixed;right:22px;bottom:20px;z-index:11;display:flex;gap:16px;align-items:center;
  padding:9px 14px;border:1px solid var(--line);border-radius:4px;background:rgba(9,20,30,.7);
  backdrop-filter:blur(10px);font-size:11.5px;color:var(--muted)}
#hud .chip{display:flex;align-items:center;gap:7px}
#hud .chip i{width:10px;height:10px;border-radius:2px}
#hud .sep{width:1px;height:14px;background:var(--line)}

@media (max-width:760px){
  #topbar{padding-left:22px}
  #controls{bottom:auto;max-height:calc(100% - 36px)}
  #hud{display:none}
}
@media (prefers-reduced-motion:reduce){.status i{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div id="topbar">
  <div class="crumb">Logística &nbsp;/&nbsp; <b>Paletizado 3D</b></div>
  <div class="status"><i></i>Simulación activa</div>
</div>

<div id="controls">

  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M17 3l12 6.5v13L17 29 5 22.5v-13L17 3z" stroke="#3fd0ff" stroke-width="1.6"/>
      <path d="M17 16l12-6.5M17 16v13M17 16L5 9.5" stroke="#3fd0ff" stroke-width="1.2" opacity=".6"/>
      <path d="M17 3l12 6.5L17 16 5 9.5 17 3z" fill="#3fd0ff" fill-opacity=".18"/>
    </svg>
    <div>
      <h1>Simulador de Pallet</h1>
      <p>Configuración de carga y visualización 3D</p>
    </div>
  </div>

  <div class="sec">
    <h2 class="sec-title">Caja</h2>

    <label for="boxDimensions">Dimensiones (largo ancho alto)</label>
    <div class="field">
      <input id="boxDimensions" type="text" value="82.00 26.00 36.00">
      <span class="unit">cm</span>
    </div>

    <label for="boxWeight">Peso por caja</label>
    <div class="field">
      <input id="boxWeight" type="number" value="13.20" step="0.01">
      <span class="unit">kg</span>
    </div>

    <button id="addBoxes">Agregar cajas</button>
  </div>

  <hr>

  <div class="sec">
    <h2 class="sec-title alt">Pallet</h2>

    <label for="palletWidthInput">Ancho</label>
    <div class="field">
      <input id="palletWidthInput" type="number" value="1.1" step="0.01">
      <span class="unit">m</span>
    </div>

    <label for="palletDepthInput">Largo</label>
    <div class="field">
      <input id="palletDepthInput" type="number" value="1.2" step="0.01">
      <span class="unit">m</span>
    </div>

    <label for="palletHeightInput">Altura</label>
    <div class="field">
      <input id="palletHeightInput" type="number" value="0.15" step="0.01">
      <span class="unit">m</span>
    </div>

    <button id="updatePallet">Actualizar pallet</button>
  </div>

  <div class="res-head">
    <h2 class="sec-title">Resultados</h2>
    <div id="result"></div>
  </div>

</div>

<div id="hud">
  <div class="chip"><i style="background:#1fb8e6"></i>Capa A</div>
  <div class="chip"><i style="background:#3a56d4"></i>Capa B</div>
  <div class="sep"></div>
  <div>Arrastra para rotar la vista</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
<script>

/* ESCENA */
var scene = new THREE.Scene();

/* CÁMARA */
var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 2.4, 3.2);
camera.lookAt(new THREE.Vector3(0, 0.7, 0));

/* RENDERER */
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);

/* ILUMINACIÓN */
scene.add(new THREE.AmbientLight(0xffffff, 0.72));

var dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);

var fillLight = new THREE.DirectionalLight(0xdcecff, 0.28);
fillLight.position.set(-3, 2, -2);
scene.add(fillLight);

/* DIMENSIONES PALLET */
var palletWidth = 1.1;
var palletDepth = 1.2;
var palletHeight = 0.15;

/* COLORES DE LAS CAJAS */
var colorA = 0x1fb8e6;
var colorB = 0x3a56d4;

/* SEPARACIÓN VISUAL */
var visualGap = 0.006;

/* FORMA REDONDEADA */
function createRoundedShape(width, height, radius) {
    var shape = new THREE.Shape();
    var r = Math.min(radius, width / 2, height / 2);

    shape.moveTo(-width / 2 + r, -height / 2);
    shape.lineTo(width / 2 - r, -height / 2);
    shape.quadraticCurveTo(width / 2, -height / 2, width / 2, -height / 2 + r);
    shape.lineTo(width / 2, height / 2 - r);
    shape.quadraticCurveTo(width / 2, height / 2, width / 2 - r, height / 2);
    shape.lineTo(-width / 2 + r, height / 2);
    shape.quadraticCurveTo(-width / 2, height / 2, -width / 2, height / 2 - r);
    shape.lineTo(-width / 2, -height / 2 + r);
    shape.quadraticCurveTo(-width / 2, -height / 2, -width / 2 + r, -height / 2);

    return shape;
}

/* GEOMETRÍA REDONDEADA */
function createRoundedBoxGeometry(width, height, depth, radius) {
    var shape = createRoundedShape(width, height, radius);

    var geometry = new THREE.ExtrudeGeometry(shape, {
        amount: depth,
        bevelEnabled: true,
        bevelThickness: Math.min(radius * 0.35, 0.012),
        bevelSize: Math.min(radius * 0.35, 0.012),
        bevelSegments: 2,
        curveSegments: 4
    });

    /* Compatible con Three.js r71. */
    geometry.applyMatrix(new THREE.Matrix4().makeTranslation(0, 0, -depth / 2));

    return geometry;
}

/* PALLET */
var palletMaterial = new THREE.MeshLambertMaterial({ color: 0xd49a4a });

var palletGeometry = createRoundedBoxGeometry(palletWidth, palletHeight, palletDepth, 0.045);

var pallet = new THREE.Mesh(palletGeometry, palletMaterial);
pallet.position.y = -palletHeight / 2;
scene.add(pallet);

/* BORDE SUAVE DEL PALLET */
var palletEdgeMaterial = new THREE.MeshBasicMaterial({
    color: 0x7a4f1c,
    wireframe: false,
    transparent: true,
    opacity: 0.28
});

var palletEdge = new THREE.Mesh(palletGeometry.clone(), palletEdgeMaterial);
palletEdge.position.copy(pallet.position);
scene.add(palletEdge);

/* GRID */
var grid = new THREE.GridHelper(5, 20);

if (grid.material) {
    grid.material.color.set(0x3fd0ff);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
}

scene.add(grid);

/* CONTROL DE CÁMARA */
var isDragging = false;
var previousMouseX = 0;
var previousMouseY = 0;
var cameraRotationY = 0;
var cameraRotationX = 0;

document.addEventListener("mousedown", function(event) {
    isDragging = true;
    previousMouseX = event.clientX;
    previousMouseY = event.clientY;
});

document.addEventListener("mouseup", function() {
    isDragging = false;
});

document.addEventListener("mousemove", function(event) {
    if (!isDragging)
        return;

    var deltaX = event.clientX - previousMouseX;
    var deltaY = event.clientY - previousMouseY;

    previousMouseX = event.clientX;
    previousMouseY = event.clientY;

    cameraRotationY += deltaX * 0.01;
    cameraRotationX += deltaY * 0.01;

    cameraRotationX = Math.max(-1.2, Math.min(1.2, cameraRotationX));
});

/* ACTUALIZAR CÁMARA */
function updateCamera() {
    var radius = 4.2;
    var targetX = 0;
    var targetY = 0.7;
    var targetZ = 0;

    camera.position.x = targetX + Math.sin(cameraRotationY) * Math.cos(cameraRotationX) * radius;
    camera.position.z = targetZ + Math.cos(cameraRotationY) * Math.cos(cameraRotationX) * radius;
    camera.position.y = targetY + Math.sin(cameraRotationX) * radius;

    camera.lookAt(new THREE.Vector3(0, 0.7, 0));
}

/* PANEL DE RESULTADOS (solo presentación) */
function renderResult(totalBoxes, maxLayers, occupancy, totalWeight) {
    var pct = Math.max(0, Math.min(100, occupancy));

    document.getElementById("result").innerHTML =
        '<div class="kpi"><span>Cajas en pallet</span><strong>' + totalBoxes + '</strong></div>' +
        '<div class="kpi"><span>Capas</span><strong>' + maxLayers + '</strong></div>' +
        '<div class="kpi wide"><span>Ocupación</span><strong>' + occupancy.toFixed(1) + '<small>%</small></strong>' +
        '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' +
        '<div class="kpi wide"><span>Peso total</span><strong>' + totalWeight.toFixed(2) + '<small>kg</small></strong></div>';
}

renderResult(0, 0, 0, 0);

/* GENERAR CAJAS */
function addBoxes() {

    var input = document.getElementById("boxDimensions").value.trim();

    var parts = input.split(/[\s,]+/);

    if (parts.length < 3) {
        alert("Ingresa Largo, Ancho y Alto.");
        return;
    }

    var boxD = parseFloat(parts[0]) / 100;
    var boxW = parseFloat(parts[1]) / 100;
    var boxH = parseFloat(parts[2]) / 100;

    var boxWeight = parseFloat(document.getElementById("boxWeight").value);

    if (isNaN(boxD) || isNaN(boxW) || isNaN(boxH)) {
        alert("Las dimensiones no son válidas.");
        return;
    }

    if (boxD <= 0 || boxW <= 0 || boxH <= 0) {
        alert("Las dimensiones deben ser mayores que cero.");
        return;
    }

    if (isNaN(boxWeight) || boxWeight < 0) {
        alert("El peso no es válido.");
        return;
    }

    /* ELIMINAR CAJAS ANTERIORES */
    var objectsToRemove = [];

    scene.traverse(function(object) {
        if (object.type === "box" || object.type === "edge") {
            objectsToRemove.push(object);
        }
    });

    for (var i = 0; i < objectsToRemove.length; i++) {
        scene.remove(objectsToRemove[i]);
    }

    /* ALTURA MÁXIMA */
    var maxStackHeight = 1.50;

    var maxLayers = Math.floor(maxStackHeight / boxH);

    var totalBoxes = 0;

    /* GENERAR UNA CAPA */
    function generateLayer(yOffset, rotateLayer) {

        var occupied = [];

        /* Índice de la capa. */
        var layerIndex = Math.round(yOffset / boxH);

        /* Contador de cajas dentro de la capa actual. */
        var layerBoxIndex = 0;

        /* COMPROBAR SI CABE */
        function fits(x, z, w, d) {

            if (
                x < -palletWidth / 2 ||
                z < -palletDepth / 2 ||
                x + w > palletWidth / 2 ||
                z + d > palletDepth / 2
            ) {
                return false;
            }

            for (var i = 0; i < occupied.length; i++) {

                var o = occupied[i];

                if (
                    x < o.x + o.w &&
                    x + w > o.x &&
                    z < o.z + o.d &&
                    z + d > o.z
                ) {
                    return false;
                }
            }

            return true;
        }

        /* ORIENTACIONES */
        var orientations = [
            { w: boxW, d: boxD },
            { w: boxD, d: boxW }
        ];

        var step = 0.01;

        /* RECORRER PALLET */
        for (var z = -palletDepth / 2; z <= palletDepth / 2; z += step) {

            for (var x = -palletWidth / 2; x <= palletWidth / 2; x += step) {

                for (var oi = 0; oi < orientations.length; oi++) {

                    var o = orientations[oi];

                    if (fits(x, z, o.w, o.d)) {

                        /* TAMAÑO VISUAL */
                        var visualW = Math.max(0.01, o.w - visualGap);
                        var visualD = Math.max(0.01, o.d - visualGap);

                        /* RADIO DE LAS CAJAS */
                        var radiusBox = Math.min(visualW, boxH) * 0.10;

                        radiusBox = Math.max(0.004, Math.min(radiusBox, 0.025));

                        /* GEOMETRÍA VISUAL */
                        var geometry = createRoundedBoxGeometry(visualW, boxH, visualD, radiusBox);

                        /* PATRÓN DE COLORES */
                        var widthIndex = Math.round((x + palletWidth / 2) / o.w);
                        var depthIndex = Math.round((z + palletDepth / 2) / o.d);

                        var colorIndex = (widthIndex + depthIndex + layerIndex) % 2;

                        var boxColor;

                        if (colorIndex === 0) {
                            boxColor = colorA;
                        } else {
                            boxColor = colorB;
                        }

                        /* MATERIAL */
                        var material = new THREE.MeshLambertMaterial({ color: boxColor });

                        /* CREAR CAJA */
                        var box = new THREE.Mesh(geometry, material);

                        /* Centramos la reducción visual dentro del espacio real de la caja. */
                        box.position.set(
                            x + o.w / 2,
                            yOffset + boxH / 2,
                            z + o.d / 2
                        );

                        box.type = "box";

                        scene.add(box);

                        /* OCUPACIÓN REAL */
                        occupied.push({ x: x, z: z, w: o.w, d: o.d });

                        totalBoxes++;

                        layerBoxIndex++;

                        break;
                    }
                }
            }
        }
    }

    /* CREAR CAPAS */
    for (var h = 0; h < maxLayers; h++) {
        generateLayer(h * boxH, h % 2 === 1);
    }

    /* CÁLCULOS ORIGINALES */
    var totalWeight = totalBoxes * boxWeight;

    var palletVolume = palletWidth * palletDepth * maxStackHeight;

    var boxVolume = boxW * boxD * boxH * totalBoxes;

    var occupancy = palletVolume > 0 ? (boxVolume / palletVolume) * 100 : 0;

    /* RESULTADO */
    renderResult(totalBoxes, maxLayers, occupancy, totalWeight);
}

/* ACTUALIZAR PALLET */
function updatePallet() {

    palletWidth = parseFloat(document.getElementById("palletWidthInput").value);
    palletDepth = parseFloat(document.getElementById("palletDepthInput").value);
    palletHeight = parseFloat(document.getElementById("palletHeightInput").value);

    if (
        isNaN(palletWidth) ||
        isNaN(palletDepth) ||
        isNaN(palletHeight) ||
        palletWidth <= 0 ||
        palletDepth <= 0 ||
        palletHeight <= 0
    ) {
        alert("Las dimensiones del pallet no son válidas.");
        return;
    }

    scene.remove(pallet);
    scene.remove(palletEdge);

    palletGeometry = createRoundedBoxGeometry(palletWidth, palletHeight, palletDepth, 0.045);

    pallet = new THREE.Mesh(palletGeometry, palletMaterial);
    pallet.position.y = -palletHeight / 2;
    scene.add(pallet);

    palletEdge = new THREE.Mesh(palletGeometry.clone(), palletEdgeMaterial);
    palletEdge.position.copy(pallet.position);
    scene.add(palletEdge);

    addBoxes();
}

/* BOTONES */
document.getElementById("addBoxes").addEventListener("click", addBoxes);
document.getElementById("updatePallet").addEventListener("click", updatePallet);

/* REDIMENSIONAR */
window.addEventListener("resize", function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ANIMACIÓN */
function animate() {
    requestAnimationFrame(animate);
    updateCamera();
    renderer.render(scene, camera);
}

/* INICIAR */
addBoxes();
animate();

</script>
</body>
</html>
