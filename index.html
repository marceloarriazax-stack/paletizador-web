
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Pallet</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

:root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #20252b;
    --muted: #707780;
    --primary: #1f2937;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --success: #15803d;
    --shadow: 0 10px 30px rgba(0,0,0,.12);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

/* =========================================================
   BARRA SUPERIOR
========================================================= */

#topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;

    background: rgba(255,255,255,.94);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 24px;

    z-index: 10;

    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.logo {
    width: 38px;
    height: 38px;

    border-radius: 9px;

    background: #1f2937;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 700;
    font-size: 18px;

    margin-right: 12px;
}

.title-area h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
}

.title-area span {
    font-size: 12px;
    color: var(--muted);
}

/* =========================================================
   PANEL LATERAL
========================================================= */

#controls {

    position: absolute;

    top: 84px;
    left: 18px;

    width: 340px;
    max-height: calc(100vh - 102px);

    background: rgba(255,255,255,.97);

    border: 1px solid rgba(0,0,0,.08);

    border-radius: 14px;

    box-shadow: var(--shadow);

    padding: 18px;

    z-index: 5;

    overflow-y: auto;
}

/* Scroll */

#controls::-webkit-scrollbar {
    width: 6px;
}

#controls::-webkit-scrollbar-track {
    background: transparent;
}

#controls::-webkit-scrollbar-thumb {
    background: #c8cdd3;
    border-radius: 10px;
}

/* =========================================================
   SECCIONES
========================================================= */

.section {
    margin-bottom: 18px;
}

.section:last-child {
    margin-bottom: 0;
}

.section-title {

    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 13px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;

    color: #3d4650;

    margin-bottom: 12px;
}

.section-number {

    width: 22px;
    height: 22px;

    background: #eef2ff;

    color: #3156c9;

    border-radius: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
    font-weight: 700;
}

/* =========================================================
   CAMPOS
========================================================= */

.field {
    margin-bottom: 11px;
}

.field label {

    display: block;

    font-size: 12px;

    color: #5d6670;

    font-weight: 600;

    margin-bottom: 5px;
}

.input {

    width: 100%;

    height: 39px;

    border: 1px solid #d6dbe1;

    border-radius: 8px;

    padding: 0 11px;

    font-size: 13px;

    color: #20252b;

    background: #fff;

    outline: none;

    transition: .15s ease;
}

.input:hover {
    border-color: #b9c0c8;
}

.input:focus {

    border-color: var(--accent);

    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

/* =========================================================
   DIMENSIONES
========================================================= */

.dimension-help {

    font-size: 11px;

    color: #8a9199;

    margin-top: 4px;
}

/* =========================================================
   BOTONES
========================================================= */

button {

    border: none;

    cursor: pointer;

    font-family: inherit;

    transition: .15s ease;
}

.primary-button {

    width: 100%;

    height: 42px;

    border-radius: 8px;

    background: var(--accent);

    color: white;

    font-size: 13px;

    font-weight: 650;

    margin-top: 5px;

    box-shadow: 0 4px 10px rgba(37,99,235,.18);
}

.primary-button:hover {

    background: var(--accent-hover);

    transform: translateY(-1px);

    box-shadow: 0 6px 14px rgba(37,99,235,.25);
}

.secondary-button {

    width: 100%;

    height: 40px;

    border-radius: 8px;

    background: #f3f4f6;

    color: #374151;

    font-size: 13px;

    font-weight: 600;

    margin-top: 4px;
}

.secondary-button:hover {
    background: #e5e7eb;
}

/* =========================================================
   SEPARADOR
========================================================= */

.separator {

    height: 1px;

    background: var(--border);

    margin: 18px 0;
}

/* =========================================================
   RESULTADOS
========================================================= */

#result-container {

    background: #f8fafc;

    border: 1px solid #e3e7ec;

    border-radius: 10px;

    padding: 12px;

    margin-top: 8px;
}

.result-title {

    font-size: 11px;

    color: #737b84;

    text-transform: uppercase;

    letter-spacing: .5px;

    font-weight: 700;

    margin-bottom: 8px;
}

#result {

    font-size: 13px;

    line-height: 1.7;

    color: #27313a;
}

.result-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 3px 0;
}

.result-label {
    color: #6b7280;
}

.result-value {
    font-weight: 700;
    color: #1f2937;
}

/* =========================================================
   ESTADO
========================================================= */

#status {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 12px;

    font-size: 11px;

    color: #6b7280;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow: 0 0 0 3px rgba(34,197,94,.12);
}

/* =========================================================
   INDICADOR DE AYUDA
========================================================= */

#instructions {

    position: absolute;

    right: 20px;
    bottom: 18px;

    background: rgba(255,255,255,.9);

    backdrop-filter: blur(8px);

    border: 1px solid rgba(0,0,0,.08);

    border-radius: 8px;

    padding: 9px 13px;

    font-size: 11px;

    color: #6b7280;

    z-index: 4;

    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    #controls {

        left: 10px;
        right: 10px;

        width: auto;

        max-height: 55vh;
    }

    #instructions {
        display: none;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         BARRA SUPERIOR
    ====================================================== -->

    <div id="topbar">

        <div class="logo">
            P
        </div>

        <div class="title-area">

            <h1>Simulador de Pallet</h1>

            <span>
                Visualización y cálculo de carga
            </span>

        </div>

    </div>


    <!-- =====================================================
         PANEL DE CONTROL
    ====================================================== -->

    <div id="controls">

        <!-- CAJAS -->

        <div class="section">

            <div class="section-title">

                <div class="section-number">
                    01
                </div>

                Configuración de caja

            </div>


            <div class="field">

                <label>
                    Dimensiones de la caja
                </label>

                <input
                    type="text"
                    id="boxDimensions"
                    class="input"
                    placeholder="82.00 26.00 36.00"
                >

                <div class="dimension-help">
                    Largo × Ancho × Alto · centímetros
                </div>

            </div>


            <div class="field">

                <label>
                    Peso por caja
                </label>

                <input
                    type="number"
                    id="boxWeight"
                    class="input"
                    placeholder="12.5"
                    step="0.01"
                    min="0"
                >

            </div>


            <button
                id="addBoxes"
                class="primary-button"
            >
                Generar pallet
            </button>

        </div>


        <div class="separator"></div>


        <!-- PALLET -->

        <div class="section">

            <div class="section-title">

                <div class="section-number">
                    02
                </div>

                Dimensiones del pallet

            </div>


            <div class="field">

                <label>
                    Ancho
                </label>

                <input
                    type="number"
                    id="palletWidthInput"
                    class="input"
                    value="1.1"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <div class="field">

                <label>
                    Largo
                </label>

                <input
                    type="number"
                    id="palletDepthInput"
                    class="input"
                    value="1.2"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <div class="field">

                <label>
                    Altura del pallet
                </label>

                <input
                    type="number"
                    id="palletHeightInput"
                    class="input"
                    value="0.15"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <button
                id="updatePallet"
                class="secondary-button"
            >
                Actualizar dimensiones
            </button>

        </div>


        <div class="separator"></div>


        <!-- RESULTADOS -->

        <div id="result-container">

            <div class="result-title">
                Resumen de carga
            </div>

            <div id="result">

                <div class="result-row">
                    <span class="result-label">
                        Cajas
                    </span>

                    <span
                        class="result-value"
                        id="resultBoxes"
                    >
                        0
                    </span>
                </div>


                <div class="result-row">
                    <span class="result-label">
                        Capas
                    </span>

                    <span
                        class="result-value"
                        id="resultLayers"
                    >
                        0
                    </span>
                </div>


                <div class="result-row">
                    <span class="result-label">
                        Ocupación
                    </span>

                    <span
                        class="result-value"
                        id="resultOccupancy"
                    >
                        0%
                    </span>
                </div>


                <div class="result-row">
                    <span class="result-label">
                        Peso total
                    </span>

                    <span
                        class="result-value"
                        id="resultWeight"
                    >
                        0 kg
                    </span>
                </div>

            </div>

        </div>


        <div id="status">

            <div class="status-dot"></div>

            Simulador listo

        </div>

    </div>


    <!-- AYUDA -->

    <div id="instructions">
        🖱️ Arrastra para rotar la vista del pallet
    </div>

</div>


<script>

/* =========================================================
   THREE.JS
========================================================= */

var scene = new THREE.Scene();

scene.background = new THREE.Color(0xf0f2f5);


var camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);


var renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   ILUMINACIÓN
========================================================= */

var ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.65
    );

scene.add(ambientLight);


var dirLight =
    new THREE.DirectionalLight(
        0xffffff,
        0.9
    );

dirLight.position.set(
    5,
    10,
    5
);

scene.add(dirLight);


/* =========================================================
   PALLET
========================================================= */

var palletWidth = 1.1;
var palletDepth = 1.2;
var palletHeight = 0.15;


var palletMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x8b5a2b
    });


var palletGeometry =
    new THREE.BoxGeometry(
        palletWidth,
        palletHeight,
        palletDepth
    );


var pallet =
    new THREE.Mesh(
        palletGeometry,
        palletMaterial
    );


pallet.position.y =
    -palletHeight / 2;


scene.add(pallet);


/* =========================================================
   PISO
========================================================= */

var grid =
    new THREE.GridHelper(
        5,
        20
    );

grid.position.y = -0.151;

scene.add(grid);


/* =========================================================
   CÁMARA
========================================================= */

var radius = 3;

var angle = 0;

var pitch = 0.3;

var pitchMin = -1;
var pitchMax = 1;


camera.position.set(
    radius * Math.cos(angle),
    1.5,
    radius * Math.sin(angle)
);

camera.lookAt(
    new THREE.Vector3(
        0,
        0,
        0
    )
);


/* =========================================================
   CONTROL DE CÁMARA
========================================================= */

var isDragging = false;

var previousMouseX = 0;
var previousMouseY = 0;


document.addEventListener(
    "mousedown",
    function(event) {

        if (event.button === 0) {

            isDragging = true;

            previousMouseX =
                event.clientX;

            previousMouseY =
                event.clientY;
        }

    }
);


document.addEventListener(
    "mouseup",
    function(event) {

        if (event.button === 0) {

            isDragging = false;

        }

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (!isDragging) return;


        var deltaX =
            event.clientX -
            previousMouseX;


        var deltaY =
            event.clientY -
            previousMouseY;


        previousMouseX =
            event.clientX;

        previousMouseY =
            event.clientY;


        angle +=
            deltaX * 0.005;


        pitch -=
            deltaY * 0.003;


        pitch =
            Math.max(
                pitchMin,
                Math.min(
                    pitchMax,
                    pitch
                )
            );


        var x =
            radius *
            Math.cos(pitch) *
            Math.cos(angle);


        var y =
            radius *
            Math.sin(pitch);


        var z =
            radius *
            Math.cos(pitch) *
            Math.sin(angle);


        camera.position.set(
            x,
            y,
            z
        );


        camera.lookAt(
            new THREE.Vector3(
                0,
                0,
                0
            )
        );

    }
);


/* =========================================================
   ANIMACIÓN
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   GENERAR CAJAS
========================================================= */

function addBoxes() {

    var input =
        document
        .getElementById(
            "boxDimensions"
        )
        .value
        .trim();


    var parts =
        input.split(
            /[\s,]+/
        );


    if (parts.length < 3) {

        alert(
            "Ingresa 3 valores: Largo, Ancho y Alto."
        );

        return;
    }


    var boxD =
        parseFloat(parts[0]) / 100;


    var boxW =
        parseFloat(parts[1]) / 100;


    var boxH =
        parseFloat(parts[2]) / 100;


    var boxWeight =
        parseFloat(
            document
            .getElementById(
                "boxWeight"
            )
            .value
        );


    if (

        isNaN(boxD) ||
        isNaN(boxW) ||
        isNaN(boxH) ||

        boxD <= 0 ||
        boxW <= 0 ||
        boxH <= 0

    ) {

        alert(
            "Las dimensiones ingresadas no son válidas."
        );

        return;
    }


    if (
        isNaN(boxWeight) ||
        boxWeight <= 0
    ) {

        alert(
            "Ingresa un peso válido para la caja."
        );

        return;
    }


    /* -----------------------------------------------------
       ELIMINAR CAJAS ANTERIORES
    ----------------------------------------------------- */

    for (
        var i =
        scene.children.length - 1;

        i >= 0;

        i--
    ) {

        if (

            scene.children[i]
            .userData &&

            (

                scene.children[i]
                .userData.type === "box"

                ||

                scene.children[i]
                .userData.type === "edge"

            )

        ) {

            scene.remove(
                scene.children[i]
            );

        }

    }


    /* -----------------------------------------------------
       ALTURA MÁXIMA
    ----------------------------------------------------- */

    var maxStackHeight = 1.50;


    var maxLayers =
        Math.floor(
            maxStackHeight /
            boxH
        );


    var totalBoxes = 0;


    /* -----------------------------------------------------
       GENERAR CAPA
    ----------------------------------------------------- */

    function generateLayer(
        yOffset,
        rotateLayer
    ) {

        var occupied = [];


        function fits(
            x,
            z,
            w,
            d
        ) {

            if (

                x + w >
                palletWidth ||

                z + d >
                palletDepth

            ) {

                return false;

            }


            for (
                var i = 0;
                i < occupied.length;
                i++
            ) {

                var r =
                    occupied[i];


                if (

                    !(
                        x + w <= r.x ||

                        x >= r.x + r.w ||

                        z + d <= r.z ||

                        z >= r.z + r.d
                    )

                ) {

                    return false;

                }

            }


            return true;

        }


        var orientations = [

            {
                w: boxW,
                d: boxD
            },

            {
                w: boxD,
                d: boxW
            }

        ];


        var step = 0.01;


        for (
            var z = 0;
            z < palletDepth;
            z += step
        ) {

            for (
                var x = 0;
                x < palletWidth;
                x += step
            ) {

                for (
                    var oi = 0;
                    oi < orientations.length;
                    oi++
                ) {

                    var o =
                        orientations[oi];


                    if (
                        fits(
                            x,
                            z,
                            o.w,
                            o.d
                        )
                    ) {

                        /* -----------------------------
                           CAJA
                        ----------------------------- */

                        var geometry =
                            new THREE.BoxGeometry(
                                o.w,
                                boxH,
                                o.d
                            );


                        var solidMaterial =
                            new THREE.MeshLambertMaterial({

                                color:
                                    rotateLayer
                                    ? 0xf4a261
                                    : 0x4ea8de

                            });


                        var box =
                            new THREE.Mesh(
                                geometry,
                                solidMaterial
                            );


                        box.position.set(

                            -palletWidth / 2 +
                            x +
                            o.w / 2,

                            boxH / 2 +
                            yOffset,

                            -palletDepth / 2 +
                            z +
                            o.d / 2

                        );


                        box.userData = {

                            type: "box"

                        };


                        scene.add(box);


                        /* -----------------------------
                           BORDES
                        ----------------------------- */

                        var wireMaterial =
                            new THREE.MeshBasicMaterial({

                                color: 0x263238,

                                wireframe: true

                            });


                        var wireBox =
                            new THREE.Mesh(
                                geometry,
                                wireMaterial
                            );


                        wireBox.position.copy(
                            box.position
                        );


                        wireBox.userData = {

                            type: "edge"

                        };


                        scene.add(
                            wireBox
                        );


                        occupied.push({

                            x: x,

                            z: z,

                            w: o.w,

                            d: o.d

                        });


                        totalBoxes++;

                    }

                }

            }

        }

    }


    /* -----------------------------------------------------
       CAPAS
    ----------------------------------------------------- */

    for (
        var h = 0;
        h < maxLayers;
        h++
    ) {

        generateLayer(

            h * boxH,

            h % 2 === 1

        );

    }


    /* =====================================================
       ESTADÍSTICAS
    ===================================================== */

    var palletVolume =
        palletWidth *
        palletDepth *
        maxStackHeight;


    var boxVolume =
        boxW *
        boxD *
        boxH *
        totalBoxes;


    var occupancy =
        (
            boxVolume /
            palletVolume *
            100
        ).toFixed(1);


    var totalWeight =
        (
            totalBoxes *
            boxWeight
        ).toFixed(2);


    /* =====================================================
       ACTUALIZAR INTERFAZ
    ===================================================== */

    document
        .getElementById(
            "resultBoxes"
        )
        .textContent =
        totalBoxes;


    document
        .getElementById(
            "resultLayers"
        )
        .textContent =
        maxLayers;


    document
        .getElementById(
            "resultOccupancy"
        )
        .textContent =
        occupancy + "%";


    document
        .getElementById(
            "resultWeight"
        )
        .textContent =
        totalWeight + " kg";

}


/* =========================================================
   BOTÓN GENERAR
========================================================= */

document
    .getElementById(
        "addBoxes"
    )
    .addEventListener(
        "click",
        addBoxes
    );


/* =========================================================
   ACTUALIZAR PALLET
========================================================= */

document
    .getElementById(
        "updatePallet"
    )
    .addEventListener(
        "click",
        function() {


            palletWidth =
                parseFloat(
                    document
                    .getElementById(
                        "palletWidthInput"
                    )
                    .value
                );


            palletDepth =
                parseFloat(
                    document
                    .getElementById(
                        "palletDepthInput"
                    )
                    .value
                );


            palletHeight =
                parseFloat(
                    document
                    .getElementById(
                        "palletHeightInput"
                    )
                    .value
                );


            scene.remove(
                pallet
            );


            palletGeometry =
                new THREE.BoxGeometry(
                    palletWidth,
                    palletHeight,
                    palletDepth
                );


            pallet =
                new THREE.Mesh(
                    palletGeometry,
                    palletMaterial
                );


            pallet.position.y =
                -palletHeight / 2;


            scene.add(
                pallet
            );


            addBoxes();

        }
    );

</script>

</body>
</html>
