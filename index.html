<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Pallet</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --background: #eef1f5;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #20252b;
    --muted: #737b84;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #16a34a;
    --shadow: 0 12px 35px rgba(0,0,0,.14);
}


/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: var(--background);

    color: var(--text);
}


/* =========================================================
   APP
========================================================= */

#app {

    width: 100%;
    height: 100%;

    position: relative;

}


/* =========================================================
   CANVAS
========================================================= */

canvas {

    display: block;

    width: 100%;
    height: 100%;

}


/* =========================================================
   BARRA SUPERIOR
========================================================= */

#topbar {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(10px);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    padding: 0 22px;

    z-index: 20;

    box-shadow:
        0 2px 12px rgba(0,0,0,.06);

}


.logo {

    width: 38px;
    height: 38px;

    border-radius: 9px;

    background:
        #1f2937;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: 700;

    font-size: 17px;

    margin-right: 12px;

}


.title-area h1 {

    margin: 0;

    font-size: 18px;

    font-weight: 650;

}


.title-area span {

    display: block;

    margin-top: 2px;

    font-size: 11px;

    color: var(--muted);

}


/* =========================================================
   PANEL
========================================================= */

#controls {

    position: absolute;

    top: 82px;
    left: 18px;

    width: 340px;

    max-height:
        calc(100vh - 100px);

    overflow-y: auto;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid rgba(0,0,0,.08);

    border-radius: 15px;

    box-shadow:
        var(--shadow);

    padding: 18px;

    z-index: 10;

}


/* Scroll */

#controls::-webkit-scrollbar {

    width: 6px;

}

#controls::-webkit-scrollbar-track {

    background: transparent;

}

#controls::-webkit-scrollbar-thumb {

    background: #cbd0d6;

    border-radius: 20px;

}


/* =========================================================
   SECTION
========================================================= */

.section {

    margin-bottom: 17px;

}


.section-title {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 13px;

    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .5px;

    color: #4b5563;

}


.section-number {

    width: 23px;
    height: 23px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 6px;

    background:
        #eff4ff;

    color:
        #315bc9;

    font-size: 10px;

    font-weight: 700;

}


/* =========================================================
   CAMPOS
========================================================= */

.field {

    margin-bottom: 11px;

}


.field label {

    display: block;

    margin-bottom: 5px;

    font-size: 12px;

    font-weight: 600;

    color: #5e6670;

}


.input {

    width: 100%;

    height: 39px;

    border:
        1px solid #d5dae0;

    border-radius: 8px;

    background: white;

    padding:
        0 11px;

    font-size: 13px;

    color: #20252b;

    outline: none;

    transition: .15s;

}


.input:hover {

    border-color:
        #b8bec6;

}


.input:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.10);

}


.help {

    margin-top: 4px;

    font-size: 10px;

    color:
        #8b929a;

}


/* =========================================================
   BOTONES
========================================================= */

button {

    font-family: inherit;

    border: none;

    cursor: pointer;

}


.primary-button {

    width: 100%;

    height: 42px;

    border-radius: 8px;

    background:
        var(--primary);

    color: white;

    font-size: 13px;

    font-weight: 650;

    box-shadow:
        0 4px 10px
        rgba(37,99,235,.20);

    transition: .15s;

}


.primary-button:hover {

    background:
        var(--primary-dark);

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 15px
        rgba(37,99,235,.25);

}


.secondary-button {

    width: 100%;

    height: 40px;

    border-radius: 8px;

    background:
        #f1f3f5;

    color:
        #374151;

    font-size: 12px;

    font-weight: 600;

    transition: .15s;

}


.secondary-button:hover {

    background:
        #e5e7eb;

}


/* =========================================================
   SEPARADOR
========================================================= */

.separator {

    height: 1px;

    background:
        var(--border);

    margin:
        18px 0;

}


/* =========================================================
   RESULTADOS
========================================================= */

#result-container {

    background:
        #f7f9fb;

    border:
        1px solid #e1e5ea;

    border-radius:
        10px;

    padding:
        12px;

}


.result-title {

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .6px;

    font-weight: 700;

    color:
        #7b838c;

    margin-bottom:
        8px;

}


.result-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding:
        4px 0;

}


.result-label {

    font-size: 12px;

    color:
        #707780;

}


.result-value {

    font-size: 13px;

    font-weight: 700;

    color:
        #1f2937;

}


/* =========================================================
   ESTADO
========================================================= */

#status {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 12px;

    font-size: 10px;

    color:
        #7b838c;

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        var(--success);

    box-shadow:
        0 0 0 3px
        rgba(22,163,74,.12);

}


/* =========================================================
   AYUDA
========================================================= */

#instructions {

    position: absolute;

    right: 18px;
    bottom: 17px;

    background:
        rgba(255,255,255,.92);

    backdrop-filter:
        blur(8px);

    border:
        1px solid rgba(0,0,0,.08);

    border-radius:
        8px;

    padding:
        9px 13px;

    color:
        #6b7280;

    font-size:
        11px;

    z-index: 5;

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.08);

}


/* =========================================================
   BOTÓN CENTRAR
========================================================= */

#centerView {

    position: absolute;

    right: 18px;
    top: 82px;

    width: 42px;
    height: 42px;

    border-radius: 9px;

    background:
        rgba(255,255,255,.94);

    border:
        1px solid rgba(0,0,0,.08);

    box-shadow:
        0 4px 14px rgba(0,0,0,.10);

    font-size: 18px;

    z-index: 10;

}


#centerView:hover {

    background: white;

    transform:
        translateY(-1px);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px) {

    #controls {

        left: 10px;
        right: 10px;

        width: auto;

        max-height: 52vh;

    }


    #instructions {

        display: none;

    }

}

</style>
</head>


<body>

<div id="app">


    <!-- =====================================================
         BARRA SUPERIOR
    ====================================================== -->

    <div id="topbar">

        <div class="logo">
            P
        </div>

        <div class="title-area">

            <h1>
                Simulador de Pallet
            </h1>

            <span>
                Visualización y cálculo de carga
            </span>

        </div>

    </div>


    <!-- =====================================================
         PANEL
    ====================================================== -->

    <div id="controls">


        <!-- CAJA -->

        <div class="section">

            <div class="section-title">

                <div class="section-number">
                    01
                </div>

                Configuración de caja

            </div>


            <div class="field">

                <label>
                    Dimensiones de la caja
                </label>

                <input
                    type="text"
                    id="boxDimensions"
                    class="input"
                    placeholder="82.00 26.00 36.00"
                >

                <div class="help">
                    Largo · Ancho · Alto en centímetros
                </div>

            </div>


            <div class="field">

                <label>
                    Peso por caja
                </label>

                <input
                    type="number"
                    id="boxWeight"
                    class="input"
                    placeholder="12.5"
                    step="0.01"
                    min="0"
                >

            </div>


            <button
                id="addBoxes"
                class="primary-button"
            >
                Generar pallet
            </button>

        </div>


        <div class="separator"></div>


        <!-- PALLET -->

        <div class="section">

            <div class="section-title">

                <div class="section-number">
                    02
                </div>

                Dimensiones del pallet

            </div>


            <div class="field">

                <label>
                    Ancho (m)
                </label>

                <input
                    type="number"
                    id="palletWidthInput"
                    class="input"
                    value="1.10"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <div class="field">

                <label>
                    Largo (m)
                </label>

                <input
                    type="number"
                    id="palletDepthInput"
                    class="input"
                    value="1.20"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <div class="field">

                <label>
                    Altura del pallet (m)
                </label>

                <input
                    type="number"
                    id="palletHeightInput"
                    class="input"
                    value="0.15"
                    step="0.05"
                    min="0.05"
                >

            </div>


            <button
                id="updatePallet"
                class="secondary-button"
            >
                Actualizar pallet
            </button>

        </div>


        <div class="separator"></div>


        <!-- RESULTADOS -->

        <div id="result-container">

            <div class="result-title">
                Resumen de carga
            </div>


            <div class="result-row">

                <span class="result-label">
                    Cajas
                </span>

                <span
                    id="resultBoxes"
                    class="result-value"
                >
                    0
                </span>

            </div>


            <div class="result-row">

                <span class="result-label">
                    Capas
                </span>

                <span
                    id="resultLayers"
                    class="result-value"
                >
                    0
                </span>

            </div>


            <div class="result-row">

                <span class="result-label">
                    Ocupación
                </span>

                <span
                    id="resultOccupancy"
                    class="result-value"
                >
                    0%
                </span>

            </div>


            <div class="result-row">

                <span class="result-label">
                    Peso total
                </span>

                <span
                    id="resultWeight"
                    class="result-value"
                >
                    0 kg
                </span>

            </div>

        </div>


        <div id="status">

            <div class="status-dot"></div>

            Simulador listo

        </div>

    </div>


    <!-- =====================================================
         BOTÓN CENTRAR
    ====================================================== -->

    <button
        id="centerView"
        title="Centrar vista"
    >
        ⌂
    </button>


    <!-- =====================================================
         AYUDA
    ====================================================== -->

    <div id="instructions">

        🖱️ Arrastra para rotar
        &nbsp;·&nbsp;
        🔍 Rueda para zoom

    </div>

</div>


<script>

/* =========================================================
   ESCENA
========================================================= */

var scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xeef1f5
    );


/* =========================================================
   CÁMARA
========================================================= */

var camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


/* =========================================================
   RENDERER
========================================================= */

var renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   ILUMINACIÓN
========================================================= */

var ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.65
    );


scene.add(
    ambientLight
);


var directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );


directionalLight.position.set(
    4,
    8,
    5
);


directionalLight.castShadow =
    true;


directionalLight.shadow.mapSize.width =
    2048;


directionalLight.shadow.mapSize.height =
    2048;


scene.add(
    directionalLight
);


/* =========================================================
   LUZ DE RELLENO
========================================================= */

var fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        0.35
    );


fillLight.position.set(
    -4,
    4,
    -4
);


scene.add(
    fillLight
);


/* =========================================================
   PALLET
========================================================= */

var palletWidth =
    1.10;

var palletDepth =
    1.20;

var palletHeight =
    0.15;


var pallet;


var palletMaterial =
    new THREE.MeshLambertMaterial({

        color:
            0x8b5a2b

    });


function createPallet() {

    if (pallet) {

        scene.remove(
            pallet
        );

    }


    var geometry =
        new THREE.BoxGeometry(

            palletWidth,

            palletHeight,

            palletDepth

        );


    pallet =
        new THREE.Mesh(
            geometry,
            palletMaterial
        );


    pallet.position.y =
        palletHeight / 2;


    pallet.castShadow =
        true;


    pallet.receiveShadow =
        true;


    scene.add(
        pallet
    );

}


createPallet();


/* =========================================================
   PISO
========================================================= */

var floorGeometry =
    new THREE.PlaneGeometry(
        20,
        20
    );


var floorMaterial =
    new THREE.MeshLambertMaterial({

        color:
            0xe2e6eb

    });


var floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );


floor.rotation.x =
    -Math.PI / 2;


floor.position.y =
    -0.001;


floor.receiveShadow =
    true;


scene.add(
    floor
);


/* =========================================================
   GRID
========================================================= */

var grid =
    new THREE.GridHelper(
        10,
        20,
        0xb7bec7,
        0xd5dae0
    );


grid.position.y =
    0.002;


scene.add(
    grid
);


/* =========================================================
   CÁMARA / ÓRBITA MANUAL
========================================================= */

var cameraRadius =
    3.4;

var cameraAngle =
    0.75;

var cameraPitch =
    0.55;


var minRadius =
    1.7;

var maxRadius =
    7;


function updateCamera() {

    var x =
        cameraRadius *
        Math.cos(cameraPitch) *
        Math.cos(cameraAngle);


    var y =
        cameraRadius *
        Math.sin(cameraPitch);


    var z =
        cameraRadius *
        Math.cos(cameraPitch) *
        Math.sin(cameraAngle);


    camera.position.set(
        x,
        y,
        z
    );


    camera.lookAt(
        new THREE.Vector3(
            0,
            0.7,
            0
        )
    );

}


updateCamera();


/* =========================================================
   MOUSE ROTACIÓN
========================================================= */

var dragging =
    false;

var lastX =
    0;

var lastY =
    0;


renderer.domElement.addEventListener(
    "mousedown",
    function(event) {

        dragging =
            true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        renderer.domElement.style.cursor =
            "grabbing";

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging =
            false;

        renderer.domElement.style.cursor =
            "grab";

    }
);


renderer.domElement.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;


        var dx =
            event.clientX -
            lastX;


        var dy =
            event.clientY -
            lastY;


        lastX =
            event.clientX;


        lastY =
            event.clientY;


        cameraAngle -=
            dx * 0.006;


        cameraPitch +=
            dy * 0.004;


        cameraPitch =
            Math.max(
                0.15,
                Math.min(
                    1.35,
                    cameraPitch
                )
            );


        updateCamera();

    }
);


renderer.domElement.style.cursor =
    "grab";


/* =========================================================
   ZOOM
========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        cameraRadius +=
            event.deltaY * 0.0025;


        cameraRadius =
            Math.max(
                minRadius,
                Math.min(
                    maxRadius,
                    cameraRadius
                )
            );


        updateCamera();

    },
    {
        passive: false
    }
);


/* =========================================================
   ELIMINAR CAJAS
========================================================= */

function removeBoxes() {

    for (
        var i =
        scene.children.length - 1;

        i >= 0;

        i--
    ) {

        var object =
            scene.children[i];


        if (
            object.userData &&
            (
                object.userData.type ===
                "box"

                ||

                object.userData.type ===
                "edge"
            )
        ) {

            scene.remove(
                object
            );

        }

    }

}


/* =========================================================
   GENERAR CAJAS
========================================================= */

function addBoxes() {

    var input =
        document
        .getElementById(
            "boxDimensions"
        )
        .value
        .trim();


    var parts =
        input.split(
            /[\s,;]+/
        );


    if (
        parts.length < 3
    ) {

        alert(
            "Ingresa las dimensiones como:\n\nLargo Ancho Alto\n\nEjemplo:\n82 26 36"
        );

        return;

    }


    var boxD =
        parseFloat(
            parts[0]
        ) / 100;


    var boxW =
        parseFloat(
            parts[1]
        ) / 100;


    var boxH =
        parseFloat(
            parts[2]
        ) / 100;


    var boxWeight =
        parseFloat(
            document
            .getElementById(
                "boxWeight"
            )
            .value
        );


    if (

        isNaN(boxD) ||
        isNaN(boxW) ||
        isNaN(boxH) ||

        boxD <= 0 ||
        boxW <= 0 ||
        boxH <= 0

    ) {

        alert(
            "Las dimensiones de la caja no son válidas."
        );

        return;

    }


    if (
        isNaN(boxWeight) ||
        boxWeight <= 0
    ) {

        alert(
            "Ingresa un peso válido."
        );

        return;

    }


    /* -----------------------------------------------------
       LIMPIAR
    ----------------------------------------------------- */

    removeBoxes();


    /* -----------------------------------------------------
       ALTURA MÁXIMA
    ----------------------------------------------------- */

    var maxStackHeight =
        1.50;


    var maxLayers =
        Math.floor(
            maxStackHeight /
            boxH
        );


    if (
        maxLayers <= 0
    ) {

        alert(
            "La altura de la caja supera la altura máxima de apilamiento."
        );

        return;

    }


    var totalBoxes =
        0;


    /* =====================================================
       GENERAR CAPA
    ===================================================== */

    function generateLayer(
        yOffset,
        rotateLayer
    ) {

        var occupied =
            [];


        function fits(
            x,
            z,
            w,
            d
        ) {

            if (
                x + w >
                palletWidth
            ) {

                return false;

            }


            if (
                z + d >
                palletDepth
            ) {

                return false;

            }


            for (
                var i = 0;
                i < occupied.length;
                i++
            ) {

                var r =
                    occupied[i];


                var overlap = !(
                    x + w <= r.x ||

                    x >=
                    r.x + r.w ||

                    z + d <= r.z ||

                    z >=
                    r.z + r.d
                );


                if (overlap) {

                    return false;

                }

            }


            return true;

        }


        var orientations = [

            {
                w: boxW,
                d: boxD
            },

            {
                w: boxD,
                d: boxW
            }

        ];


        var step =
            0.01;


        for (
            var z = 0;

            z < palletDepth;

            z += step
        ) {


            for (
                var x = 0;

                x < palletWidth;

                x += step
            ) {


                for (
                    var oi = 0;

                    oi <
                    orientations.length;

                    oi++
                ) {


                    var o =
                        orientations[oi];


                    if (
                        fits(
                            x,
                            z,
                            o.w,
                            o.d
                        )
                    ) {


                        /* --------------------------------
                           CAJA
                        -------------------------------- */

                        var geometry =
                            new THREE.BoxGeometry(

                                o.w,

                                boxH,

                                o.d

                            );


                        var material =
                            new THREE.MeshLambertMaterial({

                                color:
                                    rotateLayer
                                    ? 0xf4a261
                                    : 0x4ea8de

                            });


                        var box =
                            new THREE.Mesh(
                                geometry,
                                material
                            );


                        box.position.set(

                            -palletWidth / 2 +
                            x +
                            o.w / 2,

                            palletHeight +
                            yOffset +
                            boxH / 2,

                            -palletDepth / 2 +
                            z +
                            o.d / 2

                        );


                        box.castShadow =
                            true;


                        box.receiveShadow =
                            true;


                        box.userData = {

                            type:
                                "box"

                        };


                        scene.add(
                            box
                        );


                        /* --------------------------------
                           BORDE DE LA CAJA
                        -------------------------------- */

                        var edgeMaterial =
                            new THREE.MeshBasicMaterial({

                                color:
                                    0x263238,

                                wireframe:
                                    true

                            });


                        var edge =
                            new THREE.Mesh(

                                geometry,

                                edgeMaterial

                            );


                        edge.position.copy(
                            box.position
                        );


                        edge.userData = {

                            type:
                                "edge"

                        };


                        scene.add(
                            edge
                        );


                        /* --------------------------------
                           OCUPACIÓN
                        -------------------------------- */

                        occupied.push({

                            x:
                                x,

                            z:
                                z,

                            w:
                                o.w,

                            d:
                                o.d

                        });


                        totalBoxes++;


                        /*
                         * Importante:
                         * una vez encontrada una orientación,
                         * no seguimos probando la segunda.
                         */

                        break;

                    }

                }

            }

        }

    }


    /* =====================================================
       GENERAR TODAS LAS CAPAS
    ===================================================== */

    for (
        var layer = 0;

        layer < maxLayers;

        layer++
    ) {

        generateLayer(

            layer * boxH,

            layer % 2 === 1

        );

    }


    /* =====================================================
       ESTADÍSTICAS
    ===================================================== */

    var palletVolume =
        palletWidth *
        palletDepth *
        maxStackHeight;


    var boxVolume =
        boxW *
        boxD *
        boxH *
        totalBoxes;


    var occupancy =
        (
            boxVolume /
            palletVolume *
            100
        );


    occupancy =
        Math.min(
            occupancy,
            100
        );


    var totalWeight =
        totalBoxes *
        boxWeight;


    /* =====================================================
       MOSTRAR RESULTADOS
    ===================================================== */

    document
        .getElementById(
            "resultBoxes"
        )
        .textContent =
        totalBoxes;


    document
        .getElementById(
            "resultLayers"
        )
        .textContent =
        maxLayers;


    document
        .getElementById(
            "resultOccupancy"
        )
        .textContent =
        occupancy.toFixed(1) +
        "%";


    document
        .getElementById(
            "resultWeight"
        )
        .textContent =
        totalWeight.toFixed(2) +
        " kg";


    document
        .getElementById(
            "status"
        )
        .innerHTML =

        '<div class="status-dot"></div>' +

        'Pallet generado correctamente';

}


/* =========================================================
   GENERAR PALLET
========================================================= */

document
    .getElementById(
        "addBoxes"
    )
    .addEventListener(
        "click",
        addBoxes
    );


/* =========================================================
   ACTUALIZAR PALLET
========================================================= */

document
    .getElementById(
        "updatePallet"
    )
    .addEventListener(
        "click",
        function() {


            var newWidth =
                parseFloat(
                    document
                    .getElementById(
                        "palletWidthInput"
                    )
                    .value
                );


            var newDepth =
                parseFloat(
                    document
                    .getElementById(
                        "palletDepthInput"
                    )
                    .value
                );


            var newHeight =
                parseFloat(
                    document
                    .getElementById(
                        "palletHeightInput"
                    )
                    .value
                );


            if (

                isNaN(newWidth) ||
                isNaN(newDepth) ||
                isNaN(newHeight) ||

                newWidth <= 0 ||
                newDepth <= 0 ||
                newHeight <= 0

            ) {

                alert(
                    "Las dimensiones del pallet no son válidas."
                );

                return;

            }


            palletWidth =
                newWidth;


            palletDepth =
                newDepth;


            palletHeight =
                newHeight;


            createPallet();


            /*
             * Regenerar cajas si existen dimensiones.
             */

            var dimensions =
                document
                .getElementById(
                    "boxDimensions"
                )
                .value
                .trim();


            var weight =
                document
                .getElementById(
                    "boxWeight"
                )
                .value;


            if (
                dimensions &&
                weight
            ) {

                addBoxes();

            }


            updateCamera();

        }
    );


/* =========================================================
   CENTRAR VISTA
========================================================= */

document
    .getElementById(
        "centerView"
    )
    .addEventListener(
        "click",
        function() {


            cameraRadius =
                3.4;


            cameraAngle =
                0.75;


            cameraPitch =
                0.55;


            updateCamera();

        }
    );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMACIÓN
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


</script>

</body>
</html>
